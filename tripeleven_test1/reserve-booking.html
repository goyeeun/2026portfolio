<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예약하기 · 숲결 SOOPGYUL</title>
  <meta name="description" content="숲결 펜션 온라인 예약 신청 페이지입니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="nav-slot"></div>

  <section class="page-banner">
    <div class="page-banner__bg" style="background-image:url('https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="page-banner__inner">
      <p class="eyebrow">Reserve · Booking</p>
      <h1>예약하기</h1>
      <p class="breadcrumb">HOME <span>/</span> RESERVE <span>/</span> 예약하기</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap" style="max-width:860px;">
      <div class="center reveal" style="margin-bottom:46px;">
        <p class="eyebrow">Online Reservation</p>
        <h2 class="title">예약 신청</h2>
        <p class="lead">아래 정보를 입력해 주시면 확인 후 연락드립니다. 실시간 확정 예약은 전화로도 가능합니다.</p>
      </div>

      <div class="infobox reveal">
        <form class="form" id="bookingForm">
          <div class="form-row">
            <div class="field">
              <label for="name">예약자명</label>
              <input type="text" id="name" name="name" placeholder="이름을 입력해 주세요" required />
            </div>
            <div class="field">
              <label for="phone">연락처</label>
              <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required />
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="checkin">체크인</label>
              <input type="date" id="checkin" name="checkin" required />
            </div>
            <div class="field">
              <label for="checkout">체크아웃</label>
              <input type="date" id="checkout" name="checkout" required />
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="room">객실 선택</label>
              <select id="room" name="room" required>
                <option value="">객실을 선택해 주세요</option>
                <option value="forest">포레스트 룸 (기준 2인)</option>
                <option value="poolvilla">풀빌라 스위트 (기준 4인)</option>
                <option value="garden">가든 테라스 룸 (기준 4인)</option>
              </select>
            </div>
            <div class="field">
              <label for="guests">인원</label>
              <select id="guests" name="guests" required>
                <option value="2">2인</option>
                <option value="3">3인</option>
                <option value="4">4인</option>
                <option value="5">5인</option>
                <option value="6">6인</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="bbq">바베큐 패키지 (선택)</label>
            <select id="bbq" name="bbq">
              <option value="none">신청 안 함</option>
              <option value="hanwoo">한우 모둠 세트</option>
              <option value="pork">삼겹살 세트</option>
              <option value="grill">그릴 대여만</option>
            </select>
          </div>

          <div class="field">
            <label for="memo">요청사항</label>
            <textarea id="memo" name="memo" placeholder="픽업 서비스, 기념일 등 요청사항을 자유롭게 적어 주세요."></textarea>
          </div>

          <div id="formMsg" class="form-msg"></div>

          <p class="form-note">* 본 예약은 신청 단계이며, 담당자 확인 후 확정 안내드립니다.</p>
          <button type="submit" class="btn btn--primary" style="justify-self:start;">예약 신청하기</button>
        </form>
      </div>
    </div>
  </section>

  <section class="section--tight" style="background:var(--cream-deep);padding:70px 0;">
    <div class="wrap center reveal">
      <p class="eyebrow">Direct Call</p>
      <h2 class="title" style="font-size:2rem;">전화 예약 010-1234-5678</h2>
      <p class="lead" style="margin-left:auto;margin-right:auto;">예약 관련 문의는 매일 09:00~21:00 가능합니다. 이용 규정은 이용안내를 확인해 주세요.</p>
      <p style="margin-top:26px;">
        <a href="reserve-info.html" class="btn btn--wood">이용안내 보기</a>
      </p>
    </div>
  </section>

  <div id="footer-slot"></div>
  <script src="script.js"></script>
</body>
</html>
